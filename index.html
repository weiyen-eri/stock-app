<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>財富成長 Pro v3.5.0</title>
    <!-- 
      版本: v3.5.0 Pro (Gold & Forex Integration Master)
      更新內容:
      1. 黃金外匯整合：解鎖銀行帳戶的「買入/賣出」資產功能。銀行新增選單加入水平滑動設計，新增「買黃金/外幣」與「賣黃金/外幣」選項。
      2. 通用資產單位：將 UI 中硬編碼的「股數」字眼泛化為「數量 / 總市值」與「單位」，完美相容黃金的「克」與外匯。
      3. 動態交割面板：銀行帳戶買賣資產時，智慧展開「交割金額預估」面板，買入金額自動自銀行現金餘額扣除。
      4. 核心邏輯完美繼承：維持所有旗艦定案功能（帳戶自訂排序、配股配息精算、雙軌損益對比、五大區間查詢、主題色彩系統、自動手續費等）。
    -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            DEFAULT: 'var(--theme-primary)',
                            hover: 'var(--theme-hover)',
                            light: 'var(--theme-light)',
                            ultralight: 'var(--theme-ultralight)',
                            border: 'var(--theme-border)'
                        }
                    }
                }
            }
        };
    </script>
    
    <style>
        :root { 
            --theme-primary: #1f3a60; /* 預設星河深靛 */
            --theme-hover: #152a47;
            --theme-light: rgba(31, 58, 96, 0.12);
            --theme-ultralight: rgba(31, 58, 96, 0.05);
            --theme-border: rgba(31, 58, 96, 0.2);
            --bg-gray: #f2f2f7; 
            --safe-top: env(safe-area-inset-top); 
            --safe-bottom: env(safe-area-inset-bottom); 
            --stock-up: #ff3b30; 
            --stock-down: #34c759; 
        }
        body { background-color: var(--bg-gray); font-family: -apple-system, system-ui, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif; padding-top: var(--safe-top); color: #1c1c1e; antialiased; }
        .glass-card { background: rgba(255, 255, 255, 0.88); backdrop-filter: saturate(180%) blur(25px); border-radius: 32px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.04); border: 1px solid rgba(255, 255, 255, 0.5); overflow: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none !important; }
        .no-scrollbar { -ms-overflow-style: none !important; scrollbar-width: none !important; }
        .modal-animate { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icons = {
            RefreshCw: ({ className }) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>,
            Plus: ({ className }) => <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            PieChart: ({ className, size = 24 }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>,
            History: ({ className, size = 24 }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
            Settings: ({ className, size = 24 }) => (
                <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0-2.73-.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            ),
            Search: ({ className }) => <svg className={className} width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
            TrendingUp: ({ className, size = 20 }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="17" y1="7" x2="7" y2="17"/><polyline points="7 7 17 7 17 17"/></svg>,
            TrendingDown: ({ className, size = 20 }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="7" x2="17" y2="17"/><polyline points="17 7 17 17 7 17"/></svg>,
            Trash2: ({ className, size = 16 }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
            Edit3: ({ className, size = 16 }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>,
            Save: ({ className }) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
            X: ({ className }) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Landmark: ({ className, size = 24 }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7 12 2"/></svg>,
            ArrowRight: ({ className }) => <svg className={className} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>,
            ChevronUp: ({ className, size = 16 }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"/></svg>,
            ChevronDown: ({ className, size = 16 }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        };

        const API_URL = "https://script.google.com/macros/s/AKfycbwX_n3F8up4yUUAsZASvTOccLDAJCe5ZJWQKC0gUSlqnF2lIZhAlQe87dnotrzrStZl/exec";
        const parseNum = (v) => { const n = parseFloat(String(v || 0).replace(/[,$\s]/g, '')); return isNaN(n) ? 0 : n; };

        // --- [日期解析引擎] ---
        const safeParseDate = (dateStr) => {
            if (!dateStr) return new Date();
            let cleaned = String(dateStr).replace('上午', 'AM').replace('下午', 'PM').replace(/\//g, '-');
            let d = new Date(cleaned);
            return isNaN(d.getTime()) ? new Date() : d;
        };

        // --- [數據計算引擎] ---
        const calculateStatsCore = (dataCache, targetAcc, dateRange) => {
            if (!dataCache || !dataCache.transactions || dataCache.transactions.length === 0) {
                return { list: [], marketValue: 0, totalProfit: 0, totalRealized: 0, totalUnrealized: 0, startDate: new Date() };
            }
            const priceMap = {};
            const nameMap = {};
            (dataCache.inventory || []).forEach(item => {
                priceMap[item.代號] = parseNum(item.現價);
                nameMap[item.代號] = item.名稱 || ""; 
            });
            let relevantAccounts = [targetAcc];
            if (targetAcc !== '全部帳戶') {
                const sets = dataCache.settings || [];
                const isBank = sets.some(s => s.AccountName === targetAcc && s.Category === '銀行');
                if (isBank) {
                    const linkedBrokers = sets.filter(s => s.Category === '券商' && s.LinkedBank === targetAcc).map(s => s.AccountName);
                    relevantAccounts = [...relevantAccounts, ...linkedBrokers];
                } else {
                    const brokerSetting = sets.find(s => s.AccountName === targetAcc && s.Category === '券商');
                    if (brokerSetting && brokerSetting.LinkedBank) {
                        relevantAccounts = [...relevantAccounts, brokerSetting.LinkedBank];
                    }
                }
            }

            let txList = targetAcc === '全部帳戶' ? dataCache.transactions : dataCache.transactions.filter(t => relevantAccounts.includes(t[6]));

            if (dateRange && dateRange.type !== 'all') {
                const now = new Date();
                let startLimit = null;
                let endLimit = null;

                if (dateRange.type === 'thisMonth') {
                    startLimit = new Date(now.getFullYear(), now.getMonth(), 1); 
                } else if (dateRange.type === 'thisQuarter') {
                    const quarter = Math.floor(now.getMonth() / 3);
                    startLimit = new Date(now.getFullYear(), quarter * 3, 1); 
                } else if (dateRange.type === 'thisYear') {
                    startLimit = new Date(now.getFullYear(), 0, 1); 
                } else if (dateRange.type === 'custom') {
                    if (dateRange.start) startLimit = new Date(dateRange.start);
                    if (dateRange.end) {
                        endLimit = new Date(dateRange.end);
                        endLimit.setHours(23, 59, 59, 999); 
                    }
                }

                txList = txList.filter(t => {
                    const txDate = safeParseDate(t[0]);
                    if (startLimit && txDate < startLimit) return false;
                    if (endLimit && txDate > endLimit) return false;
                    return true;
                });
            }

            let startDate = new Date();
            if (txList.length > 0) {
                const dates = txList.map(t => safeParseDate(t[0]).getTime());
                startDate = new Date(Math.min(...dates));
            }

            const stockSymbols = new Set(
                txList.filter(t => t[1] === '買入' || t[1] === '賣出').map(t => String(t[2] || "").trim())
            );
            const allStockSymbols = new Set(
                dataCache.transactions.filter(t => t[1] === '買入' || t[1] === '賣出').map(t => String(t[2] || "").trim())
            );

            const holdings = {};
            txList.forEach(t => {
                const type = String(t[1] || "").trim();
                const symbol = String(t[2] || "").trim();
                const qty = parseNum(t[3]), price = parseNum(t[4]), fee = parseNum(t[5]), tax = parseNum(t[7]);
                
                const isEarnings = symbol.startsWith('股息:') || symbol.startsWith('利息:');
                const cleanSym = symbol.replace(/^(股息:|利息:)\s*/, '').trim();
                
                if (!cleanSym || ['現金','利息','存入','提領','轉帳'].includes(cleanSym) || cleanSym.includes('交割:')) return;
                
                const isCurrentStock = stockSymbols.has(cleanSym);
                const isAnyStock = allStockSymbols.has(cleanSym) || priceMap[cleanSym] !== undefined;

                if (type === '買入') {
                    if (!isCurrentStock) return;
                    if (!holdings[cleanSym]) holdings[cleanSym] = { qty: 0, totalBuyCost: 0, remainingCost: 0, buyQty: 0, realized: 0, dividendIncome: 0 };
                    const cost = (qty * price + fee + tax);
                    holdings[cleanSym].qty += qty; 
                    holdings[cleanSym].buyQty += qty; 
                    holdings[cleanSym].totalBuyCost += cost;
                    holdings[cleanSym].remainingCost += cost;
                } else if (type === '賣出') {
                    if (!isCurrentStock) return;
                    if (!holdings[cleanSym]) holdings[cleanSym] = { qty: 0, totalBuyCost: 0, remainingCost: 0, buyQty: 0, realized: 0, dividendIncome: 0 };
                    const unitCost = holdings[cleanSym].qty > 0 ? holdings[cleanSym].remainingCost / holdings[cleanSym].qty : 0;
                    const costOfSale = qty * unitCost;
                    holdings[cleanSym].realized += ((qty * price - fee - tax) - costOfSale);
                    holdings[cleanSym].qty -= qty;
                    holdings[cleanSym].remainingCost -= costOfSale;
                } 
                else if (type === '除權息' || type.includes('股利') || type.includes('配息') || type.includes('配股')) {
                    if (isEarnings) {
                        if (isAnyStock && isCurrentStock) {
                            if (!holdings[cleanSym]) holdings[cleanSym] = { qty: 0, totalBuyCost: 0, remainingCost: 0, buyQty: 0, realized: 0, dividendIncome: 0 };
                            holdings[cleanSym].dividendIncome += price;
                        }
                    } else {
                        if (!isCurrentStock) return;
                        if (!holdings[cleanSym]) holdings[cleanSym] = { qty: 0, totalBuyCost: 0, remainingCost: 0, buyQty: 0, realized: 0, dividendIncome: 0 };
                        if (price === 0) {
                            holdings[cleanSym].qty += qty; 
                        } else if (qty === 1 && price > 0) {
                            holdings[cleanSym].dividendIncome += price;
                        } else {
                            holdings[cleanSym].dividendIncome += (qty * price);
                        }
                    }
                } else if (type === '收益') {
                    if (isAnyStock && isCurrentStock) {
                        if (!holdings[cleanSym]) holdings[cleanSym] = { qty: 0, totalBuyCost: 0, remainingCost: 0, buyQty: 0, realized: 0, dividendIncome: 0 };
                        holdings[cleanSym].dividendIncome += (qty === 0 || qty === 1) ? price : (qty * price);
                    }
                } else if (isEarnings && (type === '存入' || type === '買入')) {
                    if (isAnyStock && isCurrentStock) {
                        if (!holdings[cleanSym]) holdings[cleanSym] = { qty: 0, totalBuyCost: 0, remainingCost: 0, buyQty: 0, realized: 0, dividendIncome: 0 };
                        holdings[cleanSym].dividendIncome += price;
                    }
                }
            });

            const list = Object.keys(holdings).map(sym => {
                const h = holdings[sym], curP = priceMap[sym] || 0;
                
                const unrealizedGain = (h.qty * curP) - h.remainingCost;
                const totalProfit = h.realized + unrealizedGain + h.dividendIncome;
                const roi = h.totalBuyCost > 0 ? (totalProfit / h.totalBuyCost) * 100 : 0;
                const adjustedAvgCost = h.qty > 0 ? (h.remainingCost - h.dividendIncome) / h.qty : 0;
                
                return { 
                    symbol: sym, 
                    name: nameMap[sym] || "", 
                    qty: h.qty, 
                    price: curP, 
                    profit: totalProfit, 
                    roi, 
                    marketVal: h.qty * curP, 
                    adjustedAvgCost, 
                    unrealized: unrealizedGain, 
                    realized: h.realized + h.dividendIncome 
                };
            });

            const totalRealized = list.reduce((sum, item) => sum + item.realized, 0);
            const totalUnrealized = list.reduce((sum, item) => sum + item.unrealized, 0);

            return { 
                list, 
                marketValue: list.reduce((a,b)=>a+b.marketVal, 0), 
                totalProfit: list.reduce((a,b)=>a+b.profit, 0), 
                totalRealized,
                totalUnrealized,
                startDate 
            };
        };

        const App = () => {
            const [data, setData] = useState(() => {
                const cache = localStorage.getItem('ledger_cache_v303');
                return cache ? JSON.parse(cache) : { summary: {}, transactions: [], settings: [], inventory: [], accountBalances: {} };
            });
            const [loading, setLoading] = useState(false);
            const [chartReady, setChartReady] = useState(true); 
            
            const [activeTab, setActiveTab] = useState('portfolio');
            const [currentAccount, setCurrentAccount] = useState('全部帳戶');
            const [currentCategory, setCurrentCategory] = useState('all');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isConfirmOpen, setIsConfirmOpen] = useState(false);
            const [confirmConfig, setConfirmConfig] = useState({ title: '', msg: '', action: null });
            const [toast, setToast] = useState({ show: false, msg: '' });

            const showToast = (msg) => { setToast({ show: true, msg }); setTimeout(() => setToast({ show: false, msg: '' }), 3000); };

            const [searchTerm, setSearchTerm] = useState('');
            const [isEditMode, setIsEditMode] = useState(false);
            const [editingIndex, setEditingIndex] = useState(-1);
            const [submitStatus, setSubmitStatus] = useState('確認並儲存');
            const [formMode, setFormMode] = useState('買入');
            const [formData, setFormData] = useState({ symbol: '', quantity: '1', price: '', fee: 0, tax: 0, memo: '', dividendCash: '', dividendStock: '', toAccount: '', date: new Date().toISOString().split('T')[0] });

            const [rankSort, setRankSort] = useState({ by: 'profit', order: 'desc' });
            const [stockSort, setStockSort] = useState('desc');

            const chartRefs = useRef({ allocation: null, trendArea: null, trendBar: null });

            const [currentTheme, setCurrentTheme] = useState(() => {
                return localStorage.getItem('ledger_theme_v309') || 'skyblue';
            });

            const [dateRange, setDateRange] = useState(() => {
                const saved = localStorage.getItem('ledger_daterange_v314');
                return saved ? JSON.parse(saved) : { type: 'all', start: '', end: '' };
            });

            const [trendPeriod, setTrendPeriod] = useState('month');

            const rangeOptions = {
                all: '全部期間',
                thisMonth: '本月',
                thisQuarter: '本季',
                thisYear: '本年',
                custom: '自定區間'
            };

            const handleRangeChange = (type) => {
                const newRange = { ...dateRange, type };
                setDateRange(newRange);
                localStorage.setItem('ledger_daterange_v314', JSON.stringify(newRange));
                if (type !== 'custom') showToast(`統計區間已更新：${rangeOptions[type]}`);
            };

            const handleCustomDateChange = (field, value) => {
                const newRange = { ...dateRange, [field]: value };
                setDateRange(newRange);
                localStorage.setItem('ledger_daterange_v314', JSON.stringify(newRange));
            };

            const themes = {
                crimson: { name: '初陽絳紅', primary: '#C93B2B', hover: '#A82E21', light: 'rgba(201, 59, 43, 0.12)', ultralight: 'rgba(201, 59, 43, 0.05)', border: 'rgba(201, 59, 43, 0.2)' },
                amber: { name: '晚霞琥橙', primary: '#E67E22', hover: '#CA6F1E', light: 'rgba(230, 126, 34, 0.12)', ultralight: 'rgba(230, 126, 34, 0.05)', border: 'rgba(230, 126, 34, 0.2)' },
                gold: { name: '煦風藤黃', primary: '#D4AC0D', hover: '#B7950B', light: 'rgba(212, 172, 13, 0.12)', ultralight: 'rgba(212, 172, 13, 0.05)', border: 'rgba(212, 172, 13, 0.2)' },
                bamboo: { name: '空山竹綠', primary: '#27AE60', hover: '#1E8449', light: 'rgba(39, 174, 96, 0.12)', ultralight: 'rgba(39, 174, 96, 0.05)', border: 'rgba(39, 174, 96, 0.2)' },
                skyblue: { name: '晴空鮮藍', primary: '#0086CC', hover: '#006BA3', light: 'rgba(0, 134, 204, 0.12)', ultralight: 'rgba(0, 134, 204, 0.05)', border: 'rgba(0, 134, 204, 0.2)' },
                indigo: { name: '星河深靛', primary: '#1F3A60', hover: '#152A47', light: 'rgba(31, 58, 96, 0.12)', ultralight: 'rgba(31, 58, 96, 0.05)', border: 'rgba(31, 58, 96, 0.2)' },
                purple: { name: '浮雲縹紫', primary: '#8E44AD', hover: '#732D91', light: 'rgba(142, 68, 173, 0.12)', ultralight: 'rgba(142, 68, 173, 0.05)', border: 'rgba(142, 68, 173, 0.2)' },
                rotation: { name: '自動輪流' }
            };

            const applyTheme = (key) => {
                let activeKey = key;
                if (key === 'rotation') {
                    const day = new Date().getDay();
                    const rotationOrder = ['purple', 'crimson', 'amber', 'gold', 'bamboo', 'skyblue', 'indigo'];
                    activeKey = rotationOrder[day];
                }
                const t = themes[activeKey] || themes['skyblue'];
                const root = document.documentElement;
                root.style.setProperty('--theme-primary', t.primary);
                root.style.setProperty('--theme-hover', t.hover);
                root.style.setProperty('--theme-light', t.light);
                root.style.setProperty('--theme-ultralight', t.ultralight);
                root.style.setProperty('--theme-border', t.border);
            };

            useEffect(() => { applyTheme(currentTheme); }, [currentTheme]);

            const handleThemeChange = (key) => {
                setCurrentTheme(key);
                localStorage.setItem('ledger_theme_v309', key);
                showToast(`已套用配色主題：${themes[key].name}`);
            };

            useEffect(() => { 
                fetchData(false); 
            }, []);

            const fetchData = async (full = false) => {
                if (full) setLoading(true);
                try {
                    const res = await fetch(`${API_URL}?t=${Date.now()}`);
                    const result = await res.json();
                    if (result.status === "success") {
                        setData(result.data);
                        localStorage.setItem('ledger_cache_v303', JSON.stringify(result.data));
                    }
                } catch (e) { showToast("連線同步失敗"); } finally { setLoading(false); }
            };

            const moveSetting = (s, direction) => {
                const index = data.settings.indexOf(s);
                if (index === -1) return;
                const newSettings = [...data.settings];
                let targetIndex = -1;
                if (direction === -1) {
                    for (let i = index - 1; i >= 0; i--) {
                        if (newSettings[i].Category === s.Category) {
                            targetIndex = i;
                            break;
                        }
                    }
                } else if (direction === 1) {
                    for (let i = index + 1; i < newSettings.length; i++) {
                        if (newSettings[i].Category === s.Category) {
                            targetIndex = i;
                            break;
                        }
                    }
                }
                if (targetIndex !== -1) {
                    [newSettings[index], newSettings[targetIndex]] = [newSettings[targetIndex], newSettings[index]];
                    setData({ ...data, settings: newSettings });
                }
            };

            const stats = useMemo(() => calculateStatsCore(data, currentAccount, dateRange), [data, currentAccount, dateRange]);
            const globalStats = useMemo(() => calculateStatsCore(data, '全部帳戶', dateRange), [data, dateRange]);
            
            const cashVal = useMemo(() => {
                const balances = data.accountBalances || {};
                const settings = data.settings || [];
                if (currentAccount === '全部帳戶') {
                    return settings.reduce((sum, s) => {
                        const bal = parseNum(balances[s.AccountName]);
                        if (s.Category === '銀行') return sum + bal;
                        if (s.Category === '券商' && (!s.LinkedBank || s.LinkedBank.trim() === "")) return sum + bal;
                        return sum;
                    }, 0);
                }
                const activeS = settings.find(x => x.AccountName === currentAccount);
                if (activeS?.Category === '券商' && activeS.LinkedBank) return parseNum(balances[activeS.LinkedBank]);
                return parseNum(balances[currentAccount]);
            }, [data.accountBalances, data.settings, currentAccount]);

            const netWorth = cashVal + stats.marketValue;
            const totalProfitValue = stats.totalProfit;
            const totalRealizedValue = stats.totalRealized;
            const totalUnrealizedValue = stats.totalUnrealized;
            const principal = netWorth - totalProfitValue;
            const roiPercent = principal > 0 ? (totalProfitValue / principal) * 100 : 0;
            const cashRatio = netWorth > 0 ? (cashVal / netWorth) * 100 : 0;

            const annualizedReturnStr = useMemo(() => {
                if (!stats.startDate || principal <= 0 || isNaN(stats.startDate.getTime())) return "--%";
                const now = new Date();
                const diffTime = Math.abs(now - stats.startDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if (diffDays < 1) return "--%";
                const years = diffDays / 365.25;
                try {
                    const cagr = (Math.pow((netWorth / principal), 1 / years) - 1) * 100;
                    if (isNaN(cagr) || !isFinite(cagr)) return "--%";
                    return (cagr > 0 ? "+" : "") + cagr.toFixed(1) + "%";
                } catch(e) { return "--%"; }
            }, [stats.startDate, netWorth, principal]);

            const settlementDisplay = useMemo(() => {
                const q = parseNum(formData.quantity), p = parseNum(formData.price), f = parseNum(formData.fee), t = parseNum(formData.tax);
                return formMode === '買入' ? (q * p + f + t) : (q * p - f - t);
            }, [formData.quantity, formData.price, formData.fee, formData.tax, formMode]);

            useEffect(() => {
                if (currentCategory === '券商' && (formMode === '買入' || formMode === '賣出')) {
                    const q = parseNum(formData.quantity), p = parseNum(formData.price), total = q * p;
                    if (total === 0) { setFormData(prev => ({ ...prev, fee: 0, tax: 0 })); return; }
                    const brokerSetting = (data.settings || []).find(x => x.AccountName === currentAccount) || { DiscountRate: 100, MinFee: 20 };
                    const discountRate = parseNum(brokerSetting.DiscountRate || 100);
                    const minFee = parseNum(brokerSetting.MinFee || 20);
                    const rawFee = total * 0.001425 * (discountRate / 100);
                    const calculatedFee = Math.max(Math.round(rawFee), minFee);
                    let calculatedTax = 0;
                    if (formMode === '賣出') {
                        const sym = String(formData.symbol || "").trim().toUpperCase();
                        if (sym.endsWith('B')) calculatedTax = 0;
                        else if (sym.startsWith('0') || sym.startsWith('9')) calculatedTax = Math.floor(total * 0.001);
                        else calculatedTax = Math.floor(total * 0.003);
                    }
                    setFormData(prev => {
                        if (prev.fee !== calculatedFee || prev.tax !== calculatedTax) return { ...prev, fee: calculatedFee, tax: calculatedTax };
                        return prev;
                    });
                } else {
                    setFormData(prev => { if (prev.fee !== 0 || prev.tax !== 0) return { ...prev, fee: 0, tax: 0 }; return prev; });
                }
            }, [formData.quantity, formData.price, formData.symbol, formMode, currentAccount, currentCategory, data.settings]);

            const trendData = useMemo(() => {
                let txs = [...data.transactions].filter(x => x && x[0]).sort((a,b) => safeParseDate(a[0]).getTime() - safeParseDate(b[0]).getTime());
                
                if (dateRange && dateRange.type !== 'all') {
                    const now = new Date(); let sL = null; let eL = null;
                    if (dateRange.type === 'thisMonth') sL = new Date(now.getFullYear(), now.getMonth(), 1);
                    else if (dateRange.type === 'thisQuarter') { const quarter = Math.floor(now.getMonth() / 3); sL = new Date(now.getFullYear(), quarter * 3, 1); }
                    else if (dateRange.type === 'thisYear') sL = new Date(now.getFullYear(), 0, 1);
                    else if (dateRange.type === 'custom') { if (dateRange.start) sL = new Date(dateRange.start); if (dateRange.end) { eL = new Date(dateRange.end); eL.setHours(23, 59, 59, 999); } }
                    txs = txs.filter(t => { const d = safeParseDate(t[0]); if (sL && d < sL) return false; if (eL && d > eL) return false; return true; });
                }

                let cum = 0;
                const periodMap = new Map();
                
                txs.forEach(t => { 
                    const impact = t[1].match(/存|買|除/) ? (parseNum(t[3])*parseNum(t[4])) : -(parseNum(t[3])*parseNum(t[4])); 
                    const d = safeParseDate(t[0]);
                    let label = '';
                    
                    if (trendPeriod === 'day') {
                        label = `${d.getMonth()+1}/${d.getDate()}`;
                    } else if (trendPeriod === 'month') {
                        label = `${d.getMonth()+1}月`;
                    } else {
                        label = `${d.getFullYear()}年`;
                    }

                    if (!periodMap.has(label)) {
                        periodMap.set(label, { delta: 0, cum: cum });
                    }
                    const p = periodMap.get(label);
                    p.delta += impact;
                    cum += impact;
                    p.cum = cum; 
                });

                const labels = Array.from(periodMap.keys());
                const vals = Array.from(periodMap.values()).map(v => v.cum);
                const deltas = Array.from(periodMap.values()).map(v => v.delta);

                const lastCum = vals.length > 0 ? vals[vals.length - 1] : 0;
                const lastDelta = deltas.length > 0 ? deltas[deltas.length - 1] : 0;

                return { labels, vals, deltas, lastCum, lastDelta };
            }, [data.transactions, dateRange, trendPeriod]);

            useEffect(() => {
                if (!chartReady) return;
                const renderCharts = () => {
                    const rootStyle = window.getComputedStyle(document.documentElement);
                    const themeColor = rootStyle.getPropertyValue('--theme-primary').trim() || '#0086CC';
                    const lightThemeColor = rootStyle.getPropertyValue('--theme-ultralight').trim() || 'rgba(0, 134, 204, 0.05)';

                    const aCtx = document.getElementById('allocation-canvas')?.getContext('2d');
                    if (aCtx) {
                        chartRefs.current.allocation?.destroy();
                        const live = stats.list.filter(h => h.qty > 0);
                        chartRefs.current.allocation = new Chart(aCtx, { 
                            type: 'doughnut', 
                            data: { 
                                labels: ['現金', ...live.map(h => `${h.symbol} ${h.name}`)], 
                                datasets: [{ 
                                    data: [cashVal, ...live.map(h => h.marketVal)], 
                                    backgroundColor: ['#FFD700', themeColor, '#ff3b30', '#ff9500', '#34c759', '#af52de', '#5ac8fa', '#ffcc00', '#4cd964', '#007aff'], 
                                    borderWidth: 4, 
                                    borderColor: '#ffffff' 
                                }] 
                            }, 
                            options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { display: false } } } 
                        });
                    }

                    if (activeTab === 'analysis') {
                        const areaCtx = document.getElementById('trend-area-canvas')?.getContext('2d');
                        const barCtx = document.getElementById('trend-bar-canvas')?.getContext('2d');
                        
                        if (areaCtx && barCtx) {
                            chartRefs.current.trendArea?.destroy();
                            chartRefs.current.trendBar?.destroy();

                            const isHex = themeColor.startsWith('#');
                            const fillStart = isHex ? themeColor + '66' : 'rgba(0, 134, 204, 0.4)';
                            const fillEnd = isHex ? themeColor + '00' : 'rgba(0, 134, 204, 0.0)';
                            
                            let grad = areaCtx.createLinearGradient(0, 0, 0, 120);
                            grad.addColorStop(0, fillStart);
                            grad.addColorStop(1, fillEnd);

                            chartRefs.current.trendArea = new Chart(areaCtx, {
                                type: 'line',
                                data: {
                                    labels: trendData.labels,
                                    datasets: [{
                                        data: trendData.vals,
                                        borderColor: themeColor,
                                        backgroundColor: grad,
                                        fill: true,
                                        tension: 0.4,
                                        borderWidth: 3,
                                        pointRadius: 0,
                                        pointHoverRadius: 5
                                    }]
                                },
                                options: {
                                    responsive: true,
                                    maintainAspectRatio: false,
                                    plugins: { legend: { display: false }, tooltip: { enabled: true } },
                                    scales: {
                                        x: { grid: { display: false }, ticks: { maxTicksLimit: 5, font: { size: 10, color: '#94a3b8' } } },
                                        y: { display: false }
                                    }
                                }
                            });

                            chartRefs.current.trendBar = new Chart(barCtx, {
                                type: 'bar',
                                data: {
                                    labels: trendData.labels,
                                    datasets: [{
                                        data: trendData.deltas,
                                        backgroundColor: trendData.deltas.map(v => v >= 0 ? '#ff3b30' : '#34c759'),
                                        borderRadius: 4,
                                        barPercentage: 0.5
                                    }]
                                },
                                options: {
                                    responsive: true,
                                    maintainAspectRatio: false,
                                    plugins: { legend: { display: false }, tooltip: { enabled: true } },
                                    scales: {
                                        x: { grid: { display: false }, ticks: { maxTicksLimit: 5, font: { size: 10, color: '#94a3b8' } } },
                                        y: { display: false }
                                    }
                                }
                            });
                        }
                    }
                };
                
                const timerId = setTimeout(renderCharts, 10);
                return () => {
                    clearTimeout(timerId);
                    Object.values(chartRefs.current).forEach(c => c?.destroy());
                };
            }, [data, currentAccount, activeTab, chartReady, stats, cashVal, currentTheme, trendData]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (currentAccount === '全部帳戶') return showToast("請選擇帳戶");
                setLoading(true); setSubmitStatus('同步中...');
                try {
                    if (formMode === '除權息') {
                        const s = (data.settings || []).find(x => x.AccountName === currentAccount);
                        const targetBank = s?.LinkedBank || currentAccount;
                        if (parseNum(formData.dividendCash) > 0) await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'insert', type: '除權息', account: targetBank, symbol: `股息:${formData.symbol}`, quantity: 1, price: formData.dividendCash, fee: 0, tax: 0, date: formData.date, memo: formData.memo }) });
                        if (parseNum(formData.dividendStock) > 0) await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'insert', type: '除權息', account: currentAccount, symbol: formData.symbol, quantity: formData.dividendStock, price: 0, fee: 0, tax: 0, date: formData.date, memo: formData.memo }) });
                    } else if (formMode === '轉帳') {
                        const body = { action: 'transfer', fromAccount: currentAccount, toAccount: formData.toAccount, amount: formData.price, date: formData.date, memo: formData.memo };
                        await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
                    } else {
                        const body = { action: isEditMode ? 'updateTransaction' : 'insert', index: editingIndex, type: formMode, account: currentAccount, symbol: formData.symbol, quantity: formData.quantity, price: formData.price, fee: formData.fee, tax: formData.tax, date: formData.date, memo: formData.memo };
                        await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
                    }
                    setSubmitStatus('儲存成功'); setTimeout(() => { setIsModalOpen(false); fetchData(); }, 800);
                } catch (e) { showToast("連線失敗"); } finally { setLoading(false); setSubmitStatus('確認並同步'); }
            };

            const editTransaction = (idx) => {
                const t = data.transactions[idx]; setEditingIndex(idx); setIsEditMode(true);
                let d = ""; try { d = safeParseDate(t[0]).toISOString().split('T')[0]; } catch(e) { d = new Date().toISOString().split('T')[0]; }
                setFormData({ symbol: t[2], quantity: parseNum(t[3]), price: parseNum(t[4]), fee: parseNum(t[5]), tax: parseNum(t[7]), memo: t[8]||"", date: d, dividendCash: '', dividendStock: '' });
                setFormMode(t[1]); setIsModalOpen(true);
            };

            const deleteTransaction = (idx) => {
                setConfirmConfig({ title: '刪除紀錄？', msg: '永久移除？連動交割需手動刪除。', action: async () => {
                    setIsConfirmOpen(false); setLoading(true);
                    try { await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteTransaction', index: idx }) }); fetchData(); } catch(e){} finally { setLoading(false); }
                }});
                setIsConfirmOpen(true);
            };

            const saveAllSettings = async () => {
                setLoading(true);
                try {
                    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "updateSettings", settings: data.settings }) });
                    if ((await res.json()).status === "success") { showToast("帳戶設定同步完成"); fetchData(true); }
                } catch (e) { showToast("連線失敗"); } finally { setLoading(false); }
            };

            const handleUpdateSetting = (index, field, value) => {
                const newSets = [...data.settings]; newSets[index][field] = value;
                setData({ ...data, settings: newSets });
            };

            return (
                <div className="min-h-screen bg-[#f2f2f7] font-sans text-slate-800 antialiased overflow-x-hidden">
                    <style>{`.no-scrollbar::-webkit-scrollbar { display: none !important; } .no-scrollbar { -ms-overflow-style: none !important; scrollbar-width: none !important; }`}</style>
                    
                    {loading && (
                        <div className="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-white/80 backdrop-blur-md transition-all">
                            <div className="w-12 h-12 border-4 border-slate-100 border-t-theme rounded-full animate-spin"></div>
                            <p className="mt-4 text-xs font-black text-slate-400 uppercase tracking-widest">精算數據中...</p>
                        </div>
                    )}

                    {/* Header */}
                    <header className="fixed top-0 z-[100] w-full bg-theme px-6 pt-6 pb-8 shadow-2xl rounded-b-[48px] transition-colors duration-500">
                        <div className="flex justify-between items-center mb-5">
                            <button onClick={() => fetchData(true)} className="p-2 bg-white/15 rounded-2xl active:scale-90 transition-transform"><Icons.RefreshCw className="text-white" /></button>
                            <div className="text-center text-white"><p className="text-[10px] font-black opacity-30 uppercase tracking-widest">Wealth Growth Pro</p><p className="text-3xl font-black tabular-nums">${Math.round(netWorth).toLocaleString()}</p></div>
                            <button onClick={() => { if(currentAccount==='全部帳戶')return showToast("請選擇帳戶"); setIsEditMode(false); setFormMode(currentCategory==='券商'?'買入':'存入'); setFormData({ symbol: '', quantity: '1', price: '', fee: 0, tax: 0, memo: '', dividendCash: '', dividendStock: '', toAccount: '', date: new Date().toISOString().split('T')[0] }); setIsModalOpen(true); }} className="p-2 bg-white rounded-2xl text-theme shadow-xl active:scale-90 transition-colors duration-500"><Icons.Plus /></button>
                        </div>
                        <div className="px-8 mb-6">
                            <div className="w-full h-1.5 bg-white/10 rounded-full overflow-hidden flex">
                                <div className="h-full transition-all duration-1000" style={{ width: `${cashRatio}%`, backgroundColor: '#FFD700' }} />
                                <div className="h-full bg-white/30" style={{ width: `${100-cashRatio}%` }} />
                            </div>
                            <div className="flex justify-between text-[8px] font-black text-white/40 uppercase mt-1.5 px-1"><span>現金 {Math.round(cashRatio)}%</span><span>持股 {Math.round(100-cashRatio)}%</span></div>
                        </div>
                        <div className="flex gap-3 overflow-x-auto no-scrollbar px-2 pb-1">
                            <button onClick={() => { setCurrentAccount('全部帳戶'); setCurrentCategory('all'); }} className={`px-5 py-3 rounded-2xl text-xs font-black transition-all whitespace-nowrap ${currentAccount==='全部帳戶'?'bg-white text-theme shadow-lg scale-105':'bg-white/10 text-white/50'}`}>全部帳戶</button>
                            {data.settings?.map((acc, i) => (
                                <button key={i} onClick={() => { setCurrentAccount(acc.AccountName); setCurrentCategory(acc.Category); }} className={`px-5 py-3 rounded-2xl text-xs font-black transition-all whitespace-nowrap ${currentAccount===acc.AccountName?'bg-white text-theme shadow-lg scale-105':'bg-white/10 text-white/50'}`}>{acc.AccountName}</button>
                            ))}
                        </div>
                    </header>

                    <main className="max-w-md mx-auto pt-64 px-5 space-y-7 pb-40">
                        {['portfolio', 'transactions'].includes(activeTab) && (
                            <>
                                {/* 三行極簡資訊控制台 */}
                                <section className="glass-card p-7 grid grid-cols-2 gap-y-5 gap-x-4 shadow-sm">
                                    <div>
                                        <p className="text-[9px] text-slate-400 font-black uppercase mb-0.5">庫存市值</p>
                                        <p className="text-xl font-black text-slate-800">${Math.round(stats.marketValue).toLocaleString()}</p>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-[9px] text-slate-400 font-black uppercase mb-0.5">年化報酬 (CAGR)</p>
                                        <p className={`text-xl font-black ${annualizedReturnStr.startsWith('-') ? 'text-green-600' : (annualizedReturnStr === '--%' ? 'text-slate-400' : 'text-red-500')}`}>{annualizedReturnStr}</p>
                                    </div>

                                    <div className="border-t border-slate-100 pt-3">
                                        <p className="text-[9px] text-theme font-black uppercase mb-0.5 transition-colors duration-500">持倉浮動損益</p>
                                        <p className={`text-base font-black ${totalUnrealizedValue>=0?'text-red-500':'text-green-600'}`}>
                                            {totalUnrealizedValue>=0?'+':''}{Math.round(totalUnrealizedValue).toLocaleString()}
                                        </p>
                                    </div>
                                    <div className="text-right border-l border-slate-100 pl-4 border-t border-slate-100 pt-3">
                                        <p className="text-[9px] text-amber-500 font-black uppercase mb-0.5">已實現損益 (含息)</p>
                                        <p className={`text-base font-black ${totalRealizedValue>=0?'text-red-500':'text-green-600'}`}>
                                            {totalRealizedValue>=0?'+':''}{Math.round(totalRealizedValue).toLocaleString()}
                                        </p>
                                    </div>

                                    <div className="border-t border-slate-100 pt-3">
                                        <p className="text-[9px] text-slate-400 font-black uppercase mb-0.5">總報酬率 (含息)</p>
                                        <p className={`text-base font-black ${totalProfitValue>=0?'text-red-500':'text-green-600'}`}>{roiPercent.toFixed(1)}%</p>
                                    </div>
                                    <div className="text-right border-l border-slate-100 pl-4 border-t border-slate-100 pt-3">
                                        <p className="text-[9px] text-slate-400 font-black uppercase mb-0.5">總損益 (含息)</p>
                                        <p className={`text-base font-black ${totalProfitValue>=0?'text-red-500':'text-green-600'}`}>
                                            {totalProfitValue>=0?'+':''}{Math.round(totalProfitValue).toLocaleString()}
                                        </p>
                                    </div>
                                </section>

                                <section className="bg-slate-900 rounded-[40px] p-9 text-white shadow-2xl relative overflow-hidden">
                                    <div className="relative z-10"><p className="text-xs font-bold text-white/40 mb-1 uppercase tracking-widest">{currentAccount==='全部帳戶'?'總可用現金':`${currentAccount} 餘額`}</p><p className="text-4xl font-black tracking-tighter tabular-nums">${Math.round(cashVal).toLocaleString()}</p></div>
                                    <Icons.Landmark size={100} className="text-white/5 absolute -right-4 -bottom-4 rotate-12" />
                                </section>

                                <nav className="flex bg-slate-200/50 rounded-[28px] p-1.5 border border-white">
                                    <button onClick={() => setActiveTab('portfolio')} className={`flex-1 py-3.5 text-xs font-black rounded-[22px] transition-all ${activeTab==='portfolio'?'bg-white text-theme shadow-sm':'text-slate-400'}`}>資產配置</button>
                                    <button onClick={() => { setActiveTab('transactions'); fetchData(false); }} className={`flex-1 py-3.5 text-xs font-black rounded-[22px] transition-all ${activeTab==='transactions'?'bg-white text-theme shadow-sm':'text-slate-400'}`}>歷史明細</button>
                                </nav>

                                {activeTab === 'portfolio' ? (
                                    <div className="space-y-6">
                                        <div className="glass-card p-6 flex flex-col items-center"><div className="w-full h-48 relative"><canvas id="allocation-canvas" /></div></div>
                                        {stats.list.filter(h=>h.qty>0).map((h, i) => (
                                            <div key={i} className="glass-card p-6 space-y-4 transition-transform active:scale-[0.98]">
                                                <div className="flex justify-between items-start">
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center gap-2 mb-1">
                                                          <span className="bg-theme text-white text-[9px] font-black px-2 py-0.5 rounded-md uppercase shrink-0 transition-colors duration-500">{h.symbol}</span>
                                                          <span className="text-slate-500 text-[10px] font-bold truncate">{h.name}</span>
                                                        </div>
                                                        <p className="text-2xl font-black text-slate-800 tracking-tighter">${h.price.toLocaleString()}</p>
                                                        <div className="mt-2 space-y-1">
                                                            <div className="flex items-center gap-1.5">
                                                                <span className="text-[9px] font-black text-slate-400 uppercase tracking-wider">還原均價</span>
                                                                <span className="text-[10px] font-bold text-slate-600">${h.adjustedAvgCost.toFixed(2)}</span>
                                                            </div>
                                                            <div className="flex items-center gap-1.5">
                                                                <span className="text-[9px] font-black text-theme uppercase tracking-wider transition-colors duration-500">{(String(h.symbol || '').includes('黃金') || String(h.name || '').includes('黃金')) ? '克數 / 市值' : '股數 / 市值'}</span>
                                                                <span className="text-[10px] font-black text-slate-800">{h.qty.toLocaleString()} / ${Math.round(h.marketVal).toLocaleString()}</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="text-right ml-4 shrink-0">

                            <div className="bg-white w-full max-w-md rounded-[48px] p-10 shadow-2xl modal-animate overflow-y-auto no-scrollbar max-h-[90vh]">
                                <div className="w-14 h-1.5 bg-slate-100 rounded-full mx-auto mb-10" />
                                <div className="flex justify-between items-start mb-8"><div><h2 className="text-3xl font-black text-slate-800 tracking-tight">{isEditMode?"修改紀錄":"新增交易"}</h2><p className="text-xs font-bold text-theme mt-1 uppercase tracking-widest transition-colors duration-500">{currentAccount}</p></div><button onClick={()=>setIsModalOpen(false)} className="p-2 bg-slate-100 rounded-full text-slate-400 active:scale-90 transition-all"><Icons.X /></button></div>
                                <div className="space-y-7">
                                    <div className="flex gap-2 p-1.5 bg-slate-100 rounded-[24px] overflow-x-auto no-scrollbar">
                                        {(currentCategory === '券商' 
                                            ? [ { label: '買入', val: '買入' }, { label: '賣出', val: '賣出' }, { label: '除權息', val: '除權息' }, { label: '存入', val: '存入' }, { label: '提領', val: '提領' } ]
                                            : [ { label: '存入', val: '存入' }, { label: '提領', val: '提領' }, { label: '轉帳', val: '轉帳' }, { label: '買黃金/外幣', val: '買入' }, { label: '賣黃金/外幣', val: '賣出' }, { label: '利息', val: '利息' } ]
                                        ).map(m => (
                                            <button 
                                                key={m.label} 
                                                onClick={() => setFormMode(m.val)} 
                                                className={`px-4 py-3 rounded-2xl font-black transition-all whitespace-nowrap flex-shrink-0 ${formMode === m.val ? (['賣出','提領'].includes(m.val) ? 'bg-white shadow-sm text-red-500' : 'bg-white shadow-sm text-theme') : 'text-slate-400'}`}
                                            >
                                                {m.label}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="space-y-5">
                                        {formMode === '轉帳' ? (
                                            <>
                                                <select value={formData.toAccount} onChange={e=>setFormData({...formData,toAccount:e.target.value})} className="w-full bg-slate-50 p-5 rounded-3xl font-black border-2 border-transparent focus:border-theme outline-none transition-colors duration-500"><option value="">選擇目標銀行</option>{data.settings.filter(acc => acc.Category === '銀行' && acc.AccountName !== currentAccount).map((acc, i) => (<option key={i} value={acc.AccountName}>{acc.AccountName}</option>))}</select>
                                                <input type="number" value={formData.price} onChange={e=>setFormData({...formData,price:e.target.value})} placeholder="轉帳金額" className="w-full bg-slate-50 p-5 rounded-3xl font-black text-xl border-2 border-transparent focus:border-theme outline-none transition-colors duration-500" />
                                            </>
                                        ) : formMode === '除權息' ? (
                                            <>
                                                <input type="text" value={formData.symbol} onChange={e=>setFormData({...formData,symbol:e.target.value})} placeholder="股票代號" className="w-full bg-slate-50 p-5 rounded-3xl font-black outline-none border-2 border-transparent focus:border-theme transition-all duration-500" />
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div className="bg-slate-50 p-4 rounded-3xl border-2 border-transparent focus-within:border-theme transition-colors duration-500"><label className="text-[9px] font-black opacity-30 uppercase block mb-1 text-center text-theme transition-colors duration-500">除息金額 ($)</label><input type="number" value={formData.dividendCash} onChange={e=>setFormData({...formData,dividendCash:e.target.value})} placeholder="0" className="w-full bg-transparent text-center font-black outline-none" /></div>
                                                    <div className="bg-slate-50 p-4 rounded-3xl border-2 border-transparent focus-within:border-theme transition-colors duration-500"><label className="text-[9px] font-black opacity-30 uppercase block mb-1 text-center text-green-600">除權股數 (單位)</label><input type="number" value={formData.dividendStock} onChange={e=>setFormData({...formData,dividendStock:e.target.value})} placeholder="0" className="w-full bg-transparent text-center font-black outline-none" /></div>
                                                </div>
                                            </>
                                        ) : formMode === '利息' ? (
                                            <>
                                                <input type="text" value={formData.symbol} onChange={e=>setFormData({...formData,symbol:e.target.value})} placeholder="資產代號" className="w-full bg-slate-50 p-5 rounded-3xl font-black outline-none border-2 border-transparent focus:border-theme transition-colors duration-500" />
                                                <input type="number" value={formData.price} onChange={e=>setFormData({...formData,price:e.target.value})} placeholder="領取總額 (含退稅)" className="w-full bg-slate-50 p-5 rounded-3xl font-black text-xl border-2 border-transparent focus:border-theme outline-none transition-colors duration-500" />
                                            </>
                                        ) : (
                                            <>
                                                <input type="text" value={formData.symbol} onChange={e=>setFormData({...formData,symbol:e.target.value})} placeholder={currentCategory === '券商' ? "股票代號" : "資產代號 (如: 黃金)"} className="w-full bg-slate-50 p-5 rounded-3xl font-black outline-none border-2 border-transparent focus:border-theme transition-colors duration-500" />
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div className="bg-slate-50 p-4 rounded-3xl border-2 border-transparent focus-within:border-theme transition-colors duration-500"><label className="text-[9px] font-black opacity-30 uppercase block mb-1">數量</label><input type="number" value={formData.quantity} onChange={e=>setFormData({...formData,quantity:e.target.value})} placeholder="數量" className="w-full bg-transparent font-black outline-none" /></div>
                                                    <div className="bg-slate-50 p-4 rounded-3xl border-2 border-transparent focus-within:border-theme transition-colors duration-500"><label className="text-[9px] font-black opacity-30 uppercase block mb-1">單價/總額</label><input type="number" value={formData.price} onChange={e=>setFormData({...formData,price:e.target.value})} placeholder="金額" className="w-full bg-transparent font-black outline-none" /></div>
                                                </div>
                                                {(formMode === '買入' || formMode === '賣出') && (
                                                    <>
                                                        <div className="grid grid-cols-2 gap-4">
                                                            <div className="bg-slate-50 p-4 rounded-3xl border-2 border-transparent focus-within:border-theme transition-colors duration-500"><label className="text-[9px] font-black opacity-30 uppercase block mb-1 text-center">手續費</label><input type="number" value={formData.fee} onChange={e=>setFormData({...formData,fee:e.target.value})} className="w-full bg-transparent text-center font-black outline-none" /></div>
                                                            <div className="bg-slate-50 p-4 rounded-3xl border-2 border-transparent focus-within:border-theme transition-colors duration-500"><label className="text-[9px] font-black opacity-30 uppercase block mb-1 text-center">交易稅</label><input type="number" value={formData.tax} onChange={e=>setFormData({...formData,tax:e.target.value})} className="w-full bg-transparent text-center font-black outline-none" /></div>
                                                        </div>
                                                        <div className="bg-theme-light p-6 rounded-[32px] text-center border border-theme-border transition-all duration-500">
                                                            <p className="text-[10px] font-black text-theme uppercase tracking-widest mb-1 transition-colors duration-500">預估交割金額</p>
                                                            <p className="text-3xl font-black text-theme tracking-tighter transition-colors duration-500">${Math.round(settlementDisplay).toLocaleString()}</p>
                                                        </div>
                                                    </>
                                                )}
                                            </>
                                        )}
                                        <input type="text" value={formData.memo} onChange={e=>setFormData({...formData,memo:e.target.value})} placeholder="備註 (選填)" className="w-full bg-slate-50 p-5 rounded-3xl font-black outline-none border-2 border-transparent focus:border-theme transition-all duration-500" />
                                        <input type="date" value={formData.date} onChange={e=>setFormData({...formData,date:e.target.value})} className="w-full bg-slate-50 p-5 rounded-3xl font-black outline-none" />
                                    </div>
                                    <button onClick={handleSubmit} disabled={loading} className="w-full bg-theme text-white py-6 rounded-[32px] font-black shadow-2xl flex justify-center items-center gap-2 text-lg active:scale-95 transition-all duration-500">{loading ? <Icons.RefreshCw className="animate-spin" /> : submitStatus}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isConfirmOpen && (
                        <div className="fixed inset-0 z-[250] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-8">
                            <div className="bg-white w-full max-sm rounded-[32px] p-8 shadow-2xl modal-animate"><h3 className="text-xl font-black text-slate-800 mb-2">{confirmConfig.title}</h3><p className="text-sm text-slate-500 font-bold mb-8 leading-relaxed">{confirmConfig.msg}</p><div className="flex gap-3"><button onClick={()=>setIsConfirmOpen(false)} className="flex-1 py-4 rounded-2xl font-black bg-slate-100 text-slate-500 active:scale-95 transition-all">取消</button><button onClick={confirmConfig.action} className="flex-1 py-4 rounded-2xl font-black bg-red-500 text-white active:scale-95 shadow-lg">確認</button></div></div>
                        </div>
                    )}
                    <div id="toast" className={`fixed top-10 left-1/2 -translate-x-1/2 z-[300] bg-slate-800 text-white px-8 py-4 rounded-full text-sm font-bold shadow-2xl transition-all duration-300 ${toast.show?'opacity-100 scale-100':'opacity-0 scale-90 pointer-events-none'}`}>{toast.msg}</div>
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
