<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>財富成長 Pro v3.0.9</title>
    <!-- 
      版本: v3.0.9 Pro (Dual-Track Profit & Loss Master)
      更新內容:
      1. 雙軌損益獨立呈現：全新實作並拆分「持倉浮動損益（未實現價差）」與「已實現損益（已賣價差+累積股息+借券利息）」，提供全方位資產回報視野。
      2. 極簡資訊控制台：首頁資產卡片升級為三行精巧版面，整齊並列「持倉損益」、「已實現損益」與「總損益」，呈現頂級 Apple Design 質感。
      3. 個股卡片損益對比：每一檔股票卡片新增顯示持倉與已實現損益對比，並支援紅漲綠跌動態色彩。
      4. 數量預設值：所有新增交易介面的「數量」欄位預設自動帶入為 "1"。
      5. 證券交易自動精算：交易時自動依據券商折扣與最低規費計算手續費；賣出時自動依標的種類（股票 0.3% / ETF 0.1% / 債券 ETF 免稅）帶入交易稅。
      6. 銀行轉帳 UI：銀行端功能優化為「存入/提領/轉帳」，並支援轉入帳戶選擇。
      7. 旗艦邏輯繼承：維持 v3.0.3 與 v3.0.7 定案之總報酬系統、名稱連動、智慧現金加總與日期解析引擎。
    -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root { --primary-blue: #007aff; --bg-gray: #f2f2f7; --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom); --stock-up: #ff3b30; --stock-down: #34c759; }
        body { background-color: var(--bg-gray); font-family: -apple-system, system-ui, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif; padding-top: var(--safe-top); color: #1c1c1e; antialiased; }
        .glass-card { background: rgba(255, 255, 255, 0.88); backdrop-filter: saturate(180%) blur(25px); border-radius: 32px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.04); border: 1px solid rgba(255, 255, 255, 0.5); overflow: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none !important; }
        .no-scrollbar { -ms-overflow-style: none !important; scrollbar-width: none !important; }
        .modal-animate { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- [圖示組件庫] ---
        const Icons = {
            RefreshCw: ({ className }) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>,
            Plus: ({ className }) => <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            PieChart: ({ className, size = 24 }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>,
            History: ({ className, size = 24 }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
            Settings: ({ className, size = 24 }) => (
                <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            ),
            Search: ({ className }) => <svg className={className} width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
            TrendingUp: ({ className }) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="17" y1="7" x2="7" y2="17"/><polyline points="7 7 17 7 17 17"/></svg>,
            TrendingDown: ({ className }) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="7" x2="17" y2="17"/><polyline points="17 7 17 17 7 17"/></svg>,
            Trash2: ({ className }) => <svg className={className} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
            Edit3: ({ className }) => <svg className={className} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>,
            Save: ({ className }) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
            X: ({ className }) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Landmark: ({ className, size = 24 }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7 12 2"/></svg>,
            ArrowRight: ({ className }) => <svg className={className} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        };

        const API_URL = "https://script.google.com/macros/s/AKfycbwX_n3F8up4yUUAsZASvTOccLDAJCe5ZJWQKC0gUSlqnF2lIZhAlQe87dnotrzrStZl/exec";
        const parseNum = (v) => { const n = parseFloat(String(v || 0).replace(/[,$\s]/g, '')); return isNaN(n) ? 0 : n; };

        // --- [日期解析引擎] ---
        const safeParseDate = (dateStr) => {
            if (!dateStr) return new Date();
            let cleaned = String(dateStr).replace('上午', 'AM').replace('下午', 'PM').replace(/\//g, '-');
            let d = new Date(cleaned);
            return isNaN(d.getTime()) ? new Date() : d;
        };

        // --- [數據計算引擎：增量優化雙軌損益] ---
        const calculateStatsCore = (dataCache, targetAcc) => {
            if (!dataCache || !dataCache.transactions || dataCache.transactions.length === 0) {
                return { list: [], marketValue: 0, totalProfit: 0, totalRealized: 0, totalUnrealized: 0, startDate: new Date() };
            }
            const priceMap = {};
            const nameMap = {};
            (dataCache.inventory || []).forEach(item => {
                priceMap[item.代號] = parseNum(item.現價);
                nameMap[item.代號] = item.名稱 || ""; 
            });
            let relevantAccounts = [targetAcc];
            if (targetAcc !== '全部帳戶') {
                const sets = dataCache.settings || [];
                const isBank = sets.some(s => s.AccountName === targetAcc && s.Category === '銀行');
                if (isBank) {
                    const linkedBrokers = sets.filter(s => s.Category === '券商' && s.LinkedBank === targetAcc).map(s => s.AccountName);
                    relevantAccounts = [...relevantAccounts, ...linkedBrokers];
                }
            }
            const filteredTx = targetAcc === '全部帳戶' ? dataCache.transactions : dataCache.transactions.filter(t => relevantAccounts.includes(t[6]));
            let startDate = new Date();
            if (filteredTx.length > 0) {
                const dates = filteredTx.map(t => safeParseDate(t[0]).getTime());
                startDate = new Date(Math.min(...dates));
            }
            const holdings = {};
            filteredTx.forEach(t => {
                const type = t[1], symbol = String(t[2] || "").trim();
                const qty = parseNum(t[3]), price = parseNum(t[4]), fee = parseNum(t[5]), tax = parseNum(t[7]);
                const isEarnings = symbol.startsWith('股息:') || symbol.startsWith('利息:');
                const cleanSym = symbol.replace(/^(股息:|利息:)/, '');
                if (!cleanSym || ['現金','利息','存入','提領','轉帳'].includes(cleanSym) || cleanSym.includes('交割:')) return;
                if (!holdings[cleanSym]) holdings[cleanSym] = { qty: 0, totalBuyCost: 0, buyQty: 0, realized: 0, dividendIncome: 0 };
                if (type === '買入') {
                    holdings[cleanSym].qty += qty; holdings[cleanSym].buyQty += qty; holdings[cleanSym].totalBuyCost += (qty * price + fee + tax);
                } else if (type === '賣出') {
                    const avgCost = holdings[cleanSym].buyQty > 0 ? (holdings[cleanSym].totalBuyCost / holdings[cleanSym].buyQty) : 0;
                    holdings[cleanSym].realized += ((qty * price - fee - tax) - (qty * avgCost));
                    holdings[cleanSym].qty -= qty;
                } else if (type === '除權息') {
                    if (isEarnings) holdings[cleanSym].dividendIncome += price;
                    else { holdings[cleanSym].qty += qty; holdings[cleanSym].dividendIncome += price; }
                } else if (type === '收益') {
                    holdings[cleanSym].dividendIncome += price;
                }
            });
            const list = Object.keys(holdings).map(sym => {
                const h = holdings[sym], curP = priceMap[sym] || 0, avgC = h.buyQty > 0 ? h.totalBuyCost / h.buyQty : 0;
                const unrealizedGain = h.qty * (curP - avgC);
                const totalProfit = h.realized + unrealizedGain + h.dividendIncome;
                const roi = h.totalBuyCost > 0 ? (totalProfit / h.totalBuyCost) * 100 : 0;
                const adjustedAvgCost = h.qty > 0 ? (h.totalBuyCost - h.dividendIncome - h.realized) / h.qty : 0;
                return { 
                    symbol: sym, 
                    name: nameMap[sym] || "", 
                    qty: h.qty, 
                    price: curP, 
                    profit: totalProfit, 
                    roi, 
                    marketVal: h.qty * curP, 
                    adjustedAvgCost,
                    unrealized: unrealizedGain,
                    realized: h.realized + h.dividendIncome
                };
            });

            const totalRealized = list.reduce((sum, item) => sum + item.realized, 0);
            const totalUnrealized = list.reduce((sum, item) => sum + item.unrealized, 0);

            return { 
                list, 
                marketValue: list.reduce((a,b)=>a+b.marketVal, 0), 
                totalProfit: list.reduce((a,b)=>a+b.profit, 0), 
                totalRealized,
                totalUnrealized,
                startDate 
            };
        };

        const App = () => {
            const [data, setData] = useState(() => {
                const cache = localStorage.getItem('ledger_cache_v303');
                return cache ? JSON.parse(cache) : { summary: {}, transactions: [], settings: [], inventory: [], accountBalances: {} };
            });
            const [loading, setLoading] = useState(false);
            const [chartReady, setChartReady] = useState(false);
            const [activeTab, setActiveTab] = useState('portfolio');
            const [currentAccount, setCurrentAccount] = useState('全部帳戶');
            const [currentCategory, setCurrentCategory] = useState('all');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isConfirmOpen, setIsConfirmOpen] = useState(false);
            const [confirmConfig, setConfirmConfig] = useState({ title: '', msg: '', action: null });
            const [toast, setToast] = useState({ show: false, msg: '' });
            const [searchTerm, setSearchTerm] = useState('');
            const [isEditMode, setIsEditMode] = useState(false);
            const [editingIndex, setEditingIndex] = useState(-1);
            const [submitStatus, setSubmitStatus] = useState('確認並儲存');
            const [formMode, setFormMode] = useState('買入');
            const [formData, setFormData] = useState({ symbol: '', quantity: '1', price: '', fee: 0, tax: 0, memo: '', dividendCash: '', dividendStock: '', toAccount: '', date: new Date().toISOString().split('T')[0] });

            const [rankSort, setRankSort] = useState({ by: 'profit', order: 'desc' });
            const [stockSort, setStockSort] = useState('desc');
            const [bankSort, setBankSort] = useState('desc');

            const chartRefs = useRef({ allocation: null, trend: null, stock: null, bank: null });

            useEffect(() => { if (window.Chart) setChartReady(true); fetchData(data.transactions.length === 0); }, []);

            const fetchData = async (full = false) => {
                if (full) setLoading(true);
                try {
                    const res = await fetch(`${API_URL}?t=${Date.now()}`);
                    const result = await res.json();
                    if (result.status === "success") {
                        setData(result.data);
                        localStorage.setItem('ledger_cache_v303', JSON.stringify(result.data));
                    }
                } catch (e) { showToast("連線同步失敗"); } finally { setLoading(false); }
            };

            const showToast = (msg) => { setToast({ show: true, msg }); setTimeout(() => setToast({ show: false, msg: '' }), 3000); };

            const stats = useMemo(() => calculateStatsCore(data, currentAccount), [data, currentAccount]);
            const globalStats = useMemo(() => calculateStatsCore(data, '全部帳戶'), [data]);
            
            const cashVal = useMemo(() => {
                const balances = data.accountBalances || {};
                const settings = data.settings || [];
                if (currentAccount === '全部帳戶') {
                    return settings.reduce((sum, s) => {
                        const bal = parseNum(balances[s.AccountName]);
                        if (s.Category === '銀行') return sum + bal;
                        if (s.Category === '券商' && (!s.LinkedBank || s.LinkedBank.trim() === "")) return sum + bal;
                        return sum;
                    }, 0);
                }
                const activeS = settings.find(x => x.AccountName === currentAccount);
                if (activeS?.Category === '券商' && activeS.LinkedBank) return parseNum(balances[activeS.LinkedBank]);
                return parseNum(balances[currentAccount]);
            }, [data.accountBalances, data.settings, currentAccount]);

            const netWorth = cashVal + stats.marketValue;
            const totalProfitValue = stats.totalProfit;
            const totalRealizedValue = stats.totalRealized;
            const totalUnrealizedValue = stats.totalUnrealized;
            const principal = netWorth - totalProfitValue;
            const roiPercent = principal > 0 ? (totalProfitValue / principal) * 100 : 0;
            const cashRatio = netWorth > 0 ? (cashVal / netWorth) * 100 : 0;

            const annualizedReturnStr = useMemo(() => {
                if (!stats.startDate || principal <= 0 || isNaN(stats.startDate.getTime())) return "--%";
                const now = new Date();
                const diffTime = Math.abs(now - stats.startDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if (diffDays < 1) return "--%";
                const years = diffDays / 365.25;
                try {
                    const cagr = (Math.pow((netWorth / principal), 1 / years) - 1) * 100;
                    if (isNaN(cagr) || !isFinite(cagr)) return "--%";
                    return (cagr > 0 ? "+" : "") + cagr.toFixed(1) + "%";
                } catch(e) { return "--%"; }
            }, [stats.startDate, netWorth, principal]);

            const settlementDisplay = useMemo(() => {
                const q = parseNum(formData.quantity), p = parseNum(formData.price), f = parseNum(formData.fee), t = parseNum(formData.tax);
                return formMode === '買入' ? (q * p + f + t) : (q * p - f - t);
            }, [formData.quantity, formData.price, formData.fee, formData.tax, formMode]);

            // --- [新增自動帶入手續費與交易稅功能] ---
            useEffect(() => {
                if (currentCategory === '券商' && (formMode === '買入' || formMode === '賣出')) {
                    const q = parseNum(formData.quantity);
                    const p = parseNum(formData.price);
                    const total = q * p;
                    if (total === 0) {
                        setFormData(prev => ({ ...prev, fee: 0, tax: 0 }));
                        return;
                    }

                    // 尋找當前券商設定
                    const brokerSetting = (data.settings || []).find(x => x.AccountName === currentAccount) || { DiscountRate: 100, MinFee: 20 };
                    const discountRate = parseNum(brokerSetting.DiscountRate || 100);
                    const minFee = parseNum(brokerSetting.MinFee || 20);

                    // 手續費計算 (千分之一點四二五 * 折扣百分比)
                    const rawFee = total * 0.001425 * (discountRate / 100);
                    const calculatedFee = Math.max(Math.round(rawFee), minFee);

                    // 交易稅計算 (僅賣出時課徵，台灣股票 0.3%, ETF 0.1%, 債券 ETF 0%)
                    let calculatedTax = 0;
                    if (formMode === '賣出') {
                        const sym = String(formData.symbol || "").trim().toUpperCase();
                        if (sym.endsWith('B')) {
                            calculatedTax = 0; // 債券型 ETF 免稅
                        } else if (sym.startsWith('0') || sym.startsWith('9')) { // 指數股票型基金 ETF
                            calculatedTax = Math.floor(total * 0.001); // ETF 0.1% 
                        } else {
                            calculatedTax = Math.floor(total * 0.003); // 一般股票 0.3%
                        }
                    }

                    setFormData(prev => {
                        // 僅在發生實質變更時才觸發 setState，避免重複調用
                        if (prev.fee !== calculatedFee || prev.tax !== calculatedTax) {
                            return { ...prev, fee: calculatedFee, tax: calculatedTax };
                        }
                        return prev;
                    });
                } else {
                    // 非證券交易買賣則歸零
                    setFormData(prev => {
                        if (prev.fee !== 0 || prev.tax !== 0) {
                            return { ...prev, fee: 0, tax: 0 };
                        }
                        return prev;
                    });
                }
            }, [formData.quantity, formData.price, formData.symbol, formMode, currentAccount, currentCategory, data.settings]);

            useEffect(() => {
                if (!chartReady) return;
                const render = () => {
                    const aCtx = document.getElementById('allocation-canvas')?.getContext('2d');
                    if (aCtx) {
                        chartRefs.current.allocation?.destroy();
                        const live = stats.list.filter(h => h.qty > 0);
                        chartRefs.current.allocation = new Chart(aCtx, { 
                            type: 'doughnut', 
                            data: { labels: ['現金', ...live.map(h => `${h.symbol} ${h.name}`)], datasets: [{ data: [cashVal, ...live.map(h => h.marketVal)], backgroundColor: ['#FFD700', '#007aff', '#ff3b30', '#ff9500', '#34c759', '#af52de'], borderWidth: 4, borderColor: '#ffffff' }] }, 
                            options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { display: false } } } 
                        });
                    }
                    if (activeTab === 'analysis') {
                        const tCtx = document.getElementById('trend-canvas')?.getContext('2d');
                        if (tCtx) {
                            chartRefs.current.trend?.destroy();
                            const txs = [...data.transactions].filter(x => x && x[0]).sort((a,b) => safeParseDate(a[0]) - safeParseDate(b[0]));
                            let cum = 0; const labels = [], vals = [];
                            txs.forEach(t => { const impact = t[1].match(/存|買|除/) ? (parseNum(t[3])*parseNum(t[4])) : -(parseNum(t[3])*parseNum(t[4])); cum += impact; labels.push(t[0].split(' ')[0]); vals.push(cum); });
                            chartRefs.current.trend = new Chart(tCtx, { type: 'line', data: { labels, datasets: [{ data: vals, borderColor: '#007aff', backgroundColor: 'rgba(0,122,255,0.05)', fill: true, tension: 0.4, borderWidth: 3, pointRadius: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { ticks: { font: { size: 9 }, callback: v => '$' + v.toLocaleString() } } } } });
                        }
                    }
                };
                render();
                return () => Object.values(chartRefs.current).forEach(c => c?.destroy());
            }, [data, currentAccount, activeTab, chartReady, stats, cashVal]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (currentAccount === '全部帳戶') return showToast("請選擇帳戶");
                setLoading(true); setSubmitStatus('同步中...');
                try {
                    if (formMode === '除權息') {
                        const s = (data.settings || []).find(x => x.AccountName === currentAccount);
                        const targetBank = s?.LinkedBank || currentAccount;
                        if (parseNum(formData.dividendCash) > 0) await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'insert', type: '除權息', account: targetBank, symbol: `股息:${formData.symbol}`, quantity: 1, price: formData.dividendCash, fee: 0, tax: 0, date: formData.date, memo: formData.memo }) });
                        if (parseNum(formData.dividendStock) > 0) await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'insert', type: '除權息', account: currentAccount, symbol: formData.symbol, quantity: formData.dividendStock, price: 0, fee: 0, tax: 0, date: formData.date, memo: formData.memo }) });
                    } else if (formMode === '轉帳') {
                        const body = { action: 'transfer', fromAccount: currentAccount, toAccount: formData.toAccount, amount: formData.price, date: formData.date, memo: formData.memo };
                        await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
                    } else {
                        const body = { action: isEditMode ? 'updateTransaction' : 'insert', index: editingIndex, type: formMode, account: currentAccount, symbol: formData.symbol, quantity: formData.quantity, price: formData.price, fee: formData.fee, tax: formData.tax, date: formData.date, memo: formData.memo };
                        await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
                    }
                    setSubmitStatus('儲存成功'); setTimeout(() => { setIsModalOpen(false); fetchData(); }, 800);
                } catch (e) { showToast("連線失敗"); } finally { setLoading(false); setSubmitStatus('確認並同步'); }
            };

            const editTransaction = (idx) => {
                const t = data.transactions[idx]; setEditingIndex(idx); setIsEditMode(true);
                let d = ""; try { d = safeParseDate(t[0]).toISOString().split('T')[0]; } catch(e) { d = new Date().toISOString().split('T')[0]; }
                setFormData({ symbol: t[2], quantity: parseNum(t[3]), price: parseNum(t[4]), fee: parseNum(t[5]), tax: parseNum(t[7]), memo: t[8]||"", date: d, dividendCash: '', dividendStock: '' });
                setFormMode(t[1]); setIsModalOpen(true);
            };

            const deleteTransaction = (idx) => {
                setConfirmConfig({ title: '刪除紀錄？', msg: '永久移除？連動交割需手動刪除。', action: async () => {
                    setIsConfirmOpen(false); setLoading(true);
                    try { await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteTransaction', index: idx }) }); fetchData(); } catch(e){} finally { setLoading(false); }
                }});
                setIsConfirmOpen(true);
            };

            const saveAllSettings = async () => {
                setLoading(true);
                try {
                    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "updateSettings", settings: data.settings }) });
                    if ((await res.json()).status === "success") { showToast("帳戶設定同步完成"); fetchData(true); }
                } catch (e) { showToast("連線失敗"); } finally { setLoading(false); }
            };

            const handleUpdateSetting = (index, field, value) => {
                const newSets = [...data.settings]; newSets[index][field] = value;
                setData({ ...data, settings: newSets });
            };

            return (
                <div className="min-h-screen bg-[#f2f2f7] font-sans text-slate-800 antialiased overflow-x-hidden">
                    <style>{`.no-scrollbar::-webkit-scrollbar { display: none !important; } .no-scrollbar { -ms-overflow-style: none !important; scrollbar-width: none !important; }`}</style>
                    
                    {loading && (
                        <div className="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-white/80 backdrop-blur-md transition-all">
                            <div className="w-12 h-12 border-4 border-slate-100 border-t-blue-600 rounded-full animate-spin"></div>
                            <p className="mt-4 text-xs font-black text-slate-400 uppercase tracking-widest">精算數據中...</p>
                        </div>
                    )}

                    {/* Header */}
                    <header className="fixed top-0 z-[100] w-full bg-blue-600 px-6 pt-6 pb-8 shadow-2xl rounded-b-[48px]">
                        <div className="flex justify-between items-center mb-5">
                            <button onClick={() => fetchData(true)} className="p-2 bg-white/15 rounded-2xl active:scale-90 transition-transform"><Icons.RefreshCw className="text-white" /></button>
                            <div className="text-center text-white"><p className="text-[10px] font-black opacity-30 uppercase tracking-widest">Wealth Growth Pro</p><p className="text-3xl font-black tabular-nums">${Math.round(netWorth).toLocaleString()}</p></div>
                            <button onClick={() => { if(currentAccount==='全部帳戶')return showToast("請選擇帳戶"); setIsEditMode(false); setFormMode(currentCategory==='券商'?'買入':'存入'); setFormData({ symbol: '', quantity: '1', price: '', fee: 0, tax: 0, memo: '', dividendCash: '', dividendStock: '', toAccount: '', date: new Date().toISOString().split('T')[0] }); setIsModalOpen(true); }} className="p-2 bg-white rounded-2xl text-blue-600 shadow-xl active:scale-90"><Icons.Plus /></button>
                        </div>
                        <div className="px-8 mb-6">
                            <div className="w-full h-1.5 bg-white/10 rounded-full overflow-hidden flex">
                                <div className="h-full transition-all duration-1000" style={{ width: `${cashRatio}%`, backgroundColor: '#FFD700' }} />
                                <div className="h-full bg-white/30" style={{ width: `${100-cashRatio}%` }} />
                            </div>
                            <div className="flex justify-between text-[8px] font-black text-white/40 uppercase mt-1.5 px-1"><span>現金 {Math.round(cashRatio)}%</span><span>持股 {Math.round(100-cashRatio)}%</span></div>
                        </div>
                        <div className="flex gap-3 overflow-x-auto no-scrollbar px-2 pb-1">
                            <button onClick={() => { setCurrentAccount('全部帳戶'); setCurrentCategory('all'); }} className={`px-5 py-3 rounded-2xl text-xs font-black transition-all whitespace-nowrap ${currentAccount==='全部帳戶'?'bg-white text-blue-600 shadow-lg scale-105':'bg-white/10 text-white/50'}`}>全部帳戶</button>
                            {data.settings?.map((acc, i) => (
                                <button key={i} onClick={() => { setCurrentAccount(acc.AccountName); setCurrentCategory(acc.Category); }} className={`px-5 py-3 rounded-2xl text-xs font-black transition-all whitespace-nowrap ${currentAccount===acc.AccountName?'bg-white text-blue-600 shadow-lg scale-105':'bg-white/10 text-white/50'}`}>{acc.AccountName}</button>
                            ))}
                        </div>
                    </header>

                    <main className="max-w-md mx-auto pt-64 px-5 space-y-7 pb-40">
                        {['portfolio', 'transactions'].includes(activeTab) && (
                            <>
                                {/* 三行極簡資訊控制台 - 修復已實現與持倉損益分離顯示 */}
                                <section className="glass-card p-7 grid grid-cols-2 gap-y-5 gap-x-4 shadow-sm">
                                    <div>
                                        <p className="text-[9px] text-slate-400 font-black uppercase mb-0.5">庫存市值</p>
                                        <p className="text-xl font-black text-slate-800">${Math.round(stats.marketValue).toLocaleString()}</p>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-[9px] text-slate-400 font-black uppercase mb-0.5">年化報酬 (CAGR)</p>
                                        <p className={`text-xl font-black ${annualizedReturnStr.startsWith('-') ? 'text-green-600' : (annualizedReturnStr === '--%' ? 'text-slate-400' : 'text-red-500')}`}>{annualizedReturnStr}</p>
                                    </div>

                                    <div className="border-t border-slate-100 pt-3">
                                        <p className="text-[9px] text-blue-500 font-black uppercase mb-0.5">持倉浮動損益</p>
                                        <p className={`text-base font-black ${totalUnrealizedValue>=0?'text-red-500':'text-green-600'}`}>
                                            {totalUnrealizedValue>=0?'+':''}{Math.round(totalUnrealizedValue).toLocaleString()}
                                        </p>
                                    </div>
                                    <div className="text-right border-l border-slate-100 pl-4 border-t border-slate-100 pt-3">
                                        <p className="text-[9px] text-amber-500 font-black uppercase mb-0.5">已實現損益 (含息)</p>
                                        <p className={`text-base font-black ${totalRealizedValue>=0?'text-red-500':'text-green-600'}`}>
                                            {totalRealizedValue>=0?'+':''}{Math.round(totalRealizedValue).toLocaleString()}
                                        </p>
                                    </div>

                                    <div className="border-t border-slate-100 pt-3">
                                        <p className="text-[9px] text-slate-400 font-black uppercase mb-0.5">總報酬率 (含息)</p>
                                        <p className={`text-base font-black ${totalProfitValue>=0?'text-red-500':'text-green-600'}`}>{roiPercent.toFixed(1)}%</p>
                                    </div>
                                    <div className="text-right border-l border-slate-100 pl-4 border-t border-slate-100 pt-3">
                                        <p className="text-[9px] text-slate-400 font-black uppercase mb-0.5">總損益 (含息)</p>
                                        <p className={`text-base font-black ${totalProfitValue>=0?'text-red-500':'text-green-600'}`}>
                                            {totalProfitValue>=0?'+':''}{Math.round(totalProfitValue).toLocaleString()}
                                        </p>
                                    </div>
                                </section>

                                <section className="bg-slate-900 rounded-[40px] p-9 text-white shadow-2xl relative overflow-hidden">
                                    <div className="relative z-10"><p className="text-xs font-bold text-white/40 mb-1 uppercase tracking-widest">{currentAccount==='全部帳戶'?'總可用現金':`${currentAccount} 餘額`}</p><p className="text-4xl font-black tracking-tighter tabular-nums">${Math.round(cashVal).toLocaleString()}</p></div>
                                    <Icons.Landmark size={100} className="text-white/5 absolute -right-4 -bottom-4 rotate-12" />
                                </section>

                                <nav className="flex bg-slate-200/50 rounded-[28px] p-1.5 border border-white">

                                    <button onClick={() => { setActiveTab('transactions'); fetchData(false); }} className={`flex-1 py-3.5 text-xs font-black rounded-[22px] transition-all ${activeTab==='transactions'?'bg-white text-blue-600 shadow-sm':'text-slate-400'}`}>歷史明細</button>
                                </nav>

                                {activeTab === 'portfolio' ? (
                                    <div className="space-y-6">
                                        <div className="glass-card p-6 flex flex-col items-center"><div className="w-full h-48 relative"><canvas id="allocation-canvas" /></div></div>
                                        {stats.list.filter(h=>h.qty>0).map((h, i) => (
                                            <div key={i} className="glass-card p-6 space-y-4 transition-transform active:scale-[0.98]">
                                                <div className="flex justify-between items-start">
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center gap-2 mb-1">
                                                          <span className="bg-blue-600 text-white text-[9px] font-black px-2 py-0.5 rounded-md uppercase shrink-0">{h.symbol}</span>
                                                          <span className="text-slate-500 text-[10px] font-bold truncate">{h.name}</span>
                                                        </div>
                                                        <p className="text-2xl font-black text-slate-800 tracking-tighter">${h.price.toLocaleString()}</p>
                                                        <div className="mt-2 space-y-1">
                                                            <div className="flex items-center gap-1.5">
                                                                <span className="text-[9px] font-black text-slate-400 uppercase tracking-wider">還原均價</span>
                                                                <span className="text-[10px] font-bold text-slate-600">${h.adjustedAvgCost.toFixed(2)}</span>
                                                            </div>
                                                            <div className="flex items-center gap-1.5">
                                                                <span className="text-[9px] font-black text-blue-500 uppercase tracking-wider">股數 / 市值</span>
                                                                <span className="text-[10px] font-black text-slate-800">{h.qty.toLocaleString()} / ${Math.round(h.marketVal).toLocaleString()}</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="text-right ml-4 shrink-0">
                                                        <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest">總損益 (含息)</p>
                                                        <p className={`text-lg font-black ${h.profit>=0?'text-red-500':'text-green-600'}`}>
                                                            {h.profit>=0?'+':''}{Math.round(h.profit).toLocaleString()}
                                                        </p>
                                                        <p className={`text-[10px] font-bold ${h.profit>=0?'text-red-400':'text-green-500'}`}>{h.roi.toFixed(1)}%</p>
                                                    </div>
                                                </div>

                                                {/* 個股持股雙軌損益對比面板 */}
                                                <div className="mt-2 pt-2 border-t border-slate-100 grid grid-cols-2 gap-2 text-[10px]">
                                                    <div>
                                                        <span className="text-[9px] font-black text-slate-400 uppercase block mb-0.5">持倉浮動損益</span>
                                                        <span className={`font-black ${h.unrealized>=0?'text-red-500':'text-green-600'}`}>
                                                            {h.unrealized>=0?'+':''}{Math.round(h.unrealized).toLocaleString()}
                                                        </span>
                                                    </div>
                                                    <div className="text-right">
                                                        <span className="text-[9px] font-black text-slate-400 uppercase block mb-0.5">已實現損益 (含息)</span>
                                                        <span className={`font-black ${h.realized>=0?'text-red-500':'text-green-600'}`}>
                                                            {h.realized>=0?'+':''}{Math.round(h.realized).toLocaleString()}
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        <div className="px-2 relative group"><input type="text" value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} placeholder="搜尋歷史紀錄..." className="w-full bg-white border border-slate-200 p-4 pl-12 rounded-2xl text-sm font-bold outline-none" /><Icons.Search className="absolute left-4 top-4 text-slate-300" /></div>
                                        {data.transactions?.map((t, idx)=>({t,idx})).filter(item => {
                                            const matchAcc = currentAccount==='全部帳戶'||item.t[6]===currentAccount;
                                            if(currentCategory==='銀行'&&matchAcc && !['買入','賣出','存入','提領','轉帳','除權息','收益'].includes(item.t[1]) && !item.t[2].includes('交割:')) return false;
                                            return matchAcc && (item.t[2].toLowerCase().includes(searchTerm.toLowerCase()) || (item.t[8]||"").toLowerCase().includes(searchTerm.toLowerCase()));
                                        }).slice().reverse().map((item, i) => {
                                            const isOut = item.t[1].match(/買|提/);
                                            const isEarning = item.t[1].match(/除|收|利/);
                                            return (
                                                <div key={i} className="glass-card p-5 flex justify-between items-center group relative fade-in">
                                                    <div className="flex items-center gap-4">
                                                        <div className={`w-11 h-11 rounded-2xl flex items-center justify-center ${isEarning?'bg-orange-50 text-orange-400':(isOut?'bg-red-50 text-red-500':'bg-blue-50 text-blue-500')}`}>
                                                            {isEarning ? <Icons.Plus size={20}/> : (isOut ? <Icons.TrendingDown size={20}/> : <Icons.TrendingUp size={20}/>)}
                                                        </div>
                                                        <div><p className="text-[9px] font-black text-slate-400 uppercase">{item.t[0].split(' ')[0]} • {item.t[6]}</p><p className="font-black text-slate-700 text-sm">{item.t[2]}</p></div>
                                                    </div>
                                                    <div className="text-right pr-10">
                                                        <p className={`font-black tabular-nums ${isEarning?'text-orange-400':(isOut?'text-red-500':'text-slate-800')}`}>{isOut?'-':'+'}{parseNum(item.t[4]).toLocaleString()}</p>
                                                        <p className="text-[9px] font-black text-slate-400 uppercase">{item.t[1]}</p>
                                                    </div>
                                                    <div className="absolute top-4 right-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                        <button onClick={()=>editTransaction(item.idx)} className="w-7 h-7 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center active:scale-90"><Icons.Edit3 size={12}/></button>
                                                        <button onClick={()=>deleteTransaction(item.idx)} className="w-7 h-7 bg-red-50 text-red-400 rounded-full flex items-center justify-center active:scale-90"><Icons.Trash2 size={12}/></button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </>
                        )}

                        {activeTab === 'analysis' && (
                            <div className="space-y-10 pb-20 fade-in">
                                <h2 className="text-3xl font-black text-slate-800 px-2 tracking-tight">資產深度分析</h2>
                                <section className="space-y-4"><h3 className="font-black text-slate-500 uppercase tracking-widest text-[10px] px-2">財富成長趨勢</h3><div className="glass-card p-6 h-64"><canvas id="trend-canvas" /></div></section>
                                <section className="space-y-4">
                                    <div className="flex justify-between items-center px-2">
                                        <h3 className="font-black text-slate-500 uppercase tracking-widest text-[10px]">個股總報酬排行 (全域)</h3>
                                        <div className="flex gap-2">
                                            <button onClick={() => setRankSort({ ...rankSort, by: rankSort.by === 'profit' ? 'roi' : 'profit'})} className={`text-[9px] font-black px-3 py-1.5 rounded-lg active:scale-95 transition-colors ${rankSort.by === 'profit' ? 'bg-slate-200 text-slate-600' : 'bg-orange-100 text-orange-600'}`}>按{rankSort.by === 'profit' ? '金額' : '報酬率'}</button>
                                            <button onClick={() => setRankSort({ ...rankSort, order: rankSort.order === 'desc' ? 'asc' : 'desc'})} className="text-[9px] font-black bg-blue-100 text-blue-600 px-3 py-1.5 rounded-lg active:scale-95">{rankSort.order === 'desc' ? '↓ 最大' : '↑ 最小'}</button>
                                        </div>
                                    </div>
                                    <div className="glass-card p-7 space-y-6">
                                        {globalStats.list.filter(s=>s.profit!==0).sort((a, b) => { let vA = rankSort.by === 'profit' ? a.profit : a.roi; let vB = rankSort.by === 'profit' ? b.profit : b.roi; return rankSort.order === 'desc' ? vB - vA : vA - vB; }).map((s,i)=>(
                                            <div key={i} className="space-y-2">
                                                <div className="flex justify-between text-[11px] font-black items-end"><span className="text-slate-500 uppercase">{s.symbol} {s.name}</span><div className="text-right"><span className={s.profit>=0?'text-red-500':'text-green-600'}>{Math.round(s.profit).toLocaleString()}</span><span className="text-slate-400 ml-1 text-[9px]">({s.roi.toFixed(1)}%)</span></div></div>
                                                <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden"><div className={`h-full ${s.profit>=0?'bg-red-500':'bg-green-500'}`} style={{width:`${Math.min(100,(Math.abs(rankSort.by === 'profit' ? s.profit : s.roi)/Math.max(...globalStats.list.map(x=>Math.abs(rankSort.by === 'profit' ? x.profit : x.roi)),1))*100)}%`}}></div></div>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                                <section className="space-y-4">
                                    <div className="flex justify-between items-center px-2">
                                        <h3 className="font-black text-slate-500 uppercase tracking-widest text-[10px]">持股資產占比</h3>
                                        <button onClick={() => setStockSort(prev => prev === 'desc' ? 'asc' : 'desc')} className="text-[9px] font-black bg-blue-100 text-blue-600 px-3 py-1.5 rounded-lg active:scale-95">{stockSort === 'desc' ? '↓ 大至小' : '↑ 小至大'}</button>
                                    </div>
                                    <div className="glass-card p-8 flex flex-col items-center">
                                        <div className="w-full mt-2 space-y-3">{globalStats.list.filter(h=>h.qty>0).sort((a,b) => stockSort === 'desc' ? b.marketVal - a.marketVal : a.marketVal - b.marketVal).map((h, i)=>(<div key={i} className="flex justify-between text-[11px] font-black text-slate-600 transition-all"><span>{h.symbol} {h.name}</span><span className="text-slate-800">${Math.round(h.marketVal).toLocaleString()} ({Math.round(h.marketVal/globalStats.marketValue*100)}%)</span></div>))}</div>
                                    </div>
                                </section>
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="space-y-10 pb-20 fade-in">
                                <h2 className="text-3xl font-black text-slate-800 px-2 tracking-tight">帳戶設定</h2>
                                <section className="space-y-5">
                                    <div className="flex justify-between items-center px-2"><h3 className="font-black text-blue-600 text-[10px] uppercase tracking-widest">證券券商系統</h3><button onClick={()=>setData({...data,settings:[{AccountName:'新券商',Category:'券商',LinkedBank:'',DiscountRate:'100',MinFee:'20'},...data.settings]})} className="bg-blue-100 text-blue-600 px-3 py-1.5 rounded-full text-[10px] font-black active:scale-95 transition-all">+ 新增</button></div>
                                    {data.settings?.filter(s=>s.Category==='券商').map((s,idx)=>(
                                        <div key={idx} className="glass-card p-7 space-y-4 relative shadow-sm border border-slate-100">
                                            <button onClick={()=>setData({...data,settings:data.settings.filter(x=>x!==s)})} className="absolute top-7 right-7 text-slate-300 active:text-red-400"><Icons.Trash2 /></button>
                                            <input type="text" value={s.AccountName} onChange={e=>handleUpdateSetting(data.settings.indexOf(s),'AccountName',e.target.value)} className="font-black text-blue-600 border-b pb-1 w-full bg-transparent outline-none text-xl focus:border-blue-600" />
                                            <div className="space-y-4">
                                                <div className="bg-slate-100/50 p-4 rounded-2xl flex flex-col"><label className="text-[9px] font-black opacity-30 uppercase mb-1">交割連動銀行</label><select value={s.LinkedBank} onChange={e=>handleUpdateSetting(data.settings.indexOf(s),'LinkedBank',e.target.value)} className="bg-transparent text-sm font-bold w-full outline-none">{data.settings.filter(b=>b.Category==='銀行').map((b,i)=>(<option key={i} value={b.AccountName}>{b.AccountName}</option>))}<option value="">無</option></select></div>
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div className="bg-slate-100/50 p-4 rounded-2xl"><label className="text-[9px] font-black opacity-30 uppercase block mb-1">折扣 %</label><input type="number" value={s.DiscountRate} onChange={e=>handleUpdateSetting(data.settings.indexOf(s),'DiscountRate',e.target.value)} className="w-full bg-transparent text-sm font-black outline-none" /></div>
                                                    <div className="bg-slate-100/50 p-4 rounded-2xl"><label className="text-[9px] font-black opacity-30 uppercase block mb-1">最低費</label><input type="number" value={s.MinFee} onChange={e=>handleUpdateSetting(data.settings.indexOf(s),'MinFee',e.target.value)} className="w-full bg-transparent text-sm font-black outline-none" /></div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </section>
                                <section className="space-y-5">
                                    <div className="flex justify-between items-center px-2"><h3 className="font-black text-slate-500 text-[10px] uppercase tracking-widest">銀行存款帳戶</h3><button onClick={()=>setData({...data,settings:[{AccountName:'新銀行',Category:'銀行',InterestRate:'0'},...data.settings]})} className="bg-slate-200 text-slate-600 px-3 py-1.5 rounded-full text-[10px] font-black active:scale-95 transition-all">+ 新增</button></div>
                                    {data.settings?.filter(s=>s.Category==='銀行').map((s,idx)=>(
                                        <div key={idx} className="glass-card p-7 space-y-4 relative shadow-sm border border-slate-100">
                                            <button onClick={()=>setData({...data,settings:data.settings.filter(x=>x!==s)})} className="absolute top-7 right-7 text-slate-300 active:text-red-400"><Icons.Trash2 /></button>
                                            <input type="text" value={s.AccountName} onChange={e=>handleUpdateSetting(data.settings.indexOf(s),'AccountName',e.target.value)} className="font-black text-slate-700 border-b pb-1 w-full bg-transparent outline-none text-xl focus:border-slate-700" />
                                            <div className="bg-slate-100/50 p-4 rounded-2xl flex flex-col"><label className="text-[9px] font-black opacity-30 uppercase block mb-1">年利率 %</label><input type="number" step="0.1" value={s.InterestRate} onChange={e=>handleUpdateSetting(data.settings.indexOf(s),'InterestRate',e.target.value)} className="bg-transparent text-sm font-black outline-none" /></div>
                                        </div>
                                    ))}
                                </section>
                                <div className="px-2"><button onClick={saveAllSettings} className="w-full bg-blue-600 text-white py-6 rounded-[32px] font-black shadow-2xl flex items-center justify-center gap-3 text-lg active:scale-95 transition-all"><Icons.Save />儲存並同步到雲端</button></div>
                            </div>
                        )}
                    </main>

                    <footer className="fixed bottom-0 w-full bg-white/80 backdrop-blur-3xl border-t border-slate-100 px-10 py-6 flex justify-around items-center z-[110]" style={{paddingBottom:'calc(15px + env(safe-area-inset-bottom))'}}>
                        <button onClick={()=>setActiveTab('portfolio')} className={`flex flex-col items-center ${activeTab==='portfolio'?'text-blue-600':'text-slate-300'}`}><Icons.PieChart size={24} /><span className="text-[10px] font-black mt-1">資產</span></button>
                        <button onClick={()=>setActiveTab('analysis')} className={`flex flex-col items-center ${activeTab==='analysis'?'text-blue-600':'text-slate-300'}`}><Icons.History size={24} /><span className="text-[10px] font-black mt-1">分析</span></button>
                        <button onClick={()=>setActiveTab('settings')} className={`flex flex-col items-center ${activeTab==='settings'?'text-blue-600':'text-slate-300'}`}><Icons.Settings size={24} /><span className="text-[10px] font-black mt-1">設定</span></button>
                    </footer>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-[150] bg-slate-900/60 backdrop-blur-md flex items-end justify-center p-4">
                            <div className="bg-white w-full max-w-md rounded-[48px] p-10 shadow-2xl modal-animate overflow-y-auto no-scrollbar max-h-[90vh]">
                                <div className="w-14 h-1.5 bg-slate-100 rounded-full mx-auto mb-10" />
                                <div className="flex justify-between items-start mb-8"><div><h2 className="text-3xl font-black text-slate-800 tracking-tight">{isEditMode?"修改紀錄":"新增交易"}</h2><p className="text-xs font-bold text-blue-600 mt-1 uppercase tracking-widest">{currentAccount}</p></div><button onClick={()=>setIsModalOpen(false)} className="p-2 bg-slate-100 rounded-full text-slate-400 active:scale-90 transition-all"><Icons.X size={20}/></button></div>
                                <div className="space-y-7">
                                    <div className="flex gap-2 p-1.5 bg-slate-100 rounded-[24px]">
                                        <button onClick={()=>setFormMode(currentCategory==='券商'?'買入':'存入')} className={`flex-1 py-4 rounded-2xl font-black transition-all ${['買入','存入'].includes(formMode)?'bg-white shadow-sm text-blue-600':'text-slate-400'}`}>{currentCategory==='券商'?'買入':'存入'}</button>
                                        <button onClick={()=>setFormMode(currentCategory==='券商'?'賣出':'提領')} className={`flex-1 py-4 rounded-2xl font-black transition-all ${['賣出','提領'].includes(formMode)?'bg-white shadow-sm text-red-500':'text-slate-400'}`}>{currentCategory==='券商'?'賣出':'提領'}</button>
                                        <button onClick={()=>setFormMode(currentCategory==='券商'?'除權息':'轉帳')} className={`flex-1 py-4 rounded-2xl font-black transition-all ${['除權息','轉帳'].includes(formMode)?'bg-white shadow-sm text-blue-600':'text-slate-400'}`}>{currentCategory==='券商'?'除權息':'轉帳'}</button>
                                    </div>
                                    <div className="space-y-5">
                                        {formMode === '轉帳' ? (
                                            <>
                                                <select value={formData.toAccount} onChange={e=>setFormData({...formData,toAccount:e.target.value})} className="w-full bg-slate-50 p-5 rounded-3xl font-black border-2 border-transparent focus:border-blue-500 outline-none"><option value="">選擇目標銀行</option>{data.settings.filter(acc => acc.Category === '銀行' && acc.AccountName !== currentAccount).map((acc, i) => (<option key={i} value={acc.AccountName}>{acc.AccountName}</option>))}</select>
                                                <input type="number" value={formData.price} onChange={e=>setFormData({...formData,price:e.target.value})} placeholder="轉帳金額" className="w-full bg-slate-50 p-5 rounded-3xl font-black text-xl border-2 border-transparent focus:border-blue-500 outline-none" />
                                            </>
                                        ) : formMode === '除權息' ? (
                                            <>
                                                <input type="text" value={formData.symbol} onChange={e=>setFormData({...formData,symbol:e.target.value})} placeholder="股票代號" className="w-full bg-slate-50 p-5 rounded-3xl font-black outline-none border-2 border-transparent focus:border-blue-500 transition-all" />
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div className="bg-slate-50 p-4 rounded-3xl border-2 border-transparent focus-within:border-blue-500"><label className="text-[9px] font-black opacity-30 uppercase block mb-1 text-center text-blue-600">除息金額 ($)</label><input type="number" value={formData.dividendCash} onChange={e=>setFormData({...formData,dividendCash:e.target.value})} placeholder="0" className="w-full bg-transparent text-center font-black outline-none" /></div>
                                                    <div className="bg-slate-50 p-4 rounded-3xl border-2 border-transparent focus-within:border-blue-500"><label className="text-[9px] font-black opacity-30 uppercase block mb-1 text-center text-green-600">除權股數 (股)</label><input type="number" value={formData.dividendStock} onChange={e=>setFormData({...formData,dividendStock:e.target.value})} placeholder="0" className="w-full bg-transparent text-center font-black outline-none" /></div>
                                                </div>
                                            </>
                                        ) : (
                                            <>
                                                <input type="text" value={formData.symbol} onChange={e=>setFormData({...formData,symbol:e.target.value})} placeholder={currentCategory==='券商'?"股票代號":"摘要備註"} className="w-full bg-slate-50 p-5 rounded-3xl font-black outline-none border-2 border-transparent focus:border-blue-500" />
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div className="bg-slate-50 p-4 rounded-3xl border-2 border-transparent focus-within:border-blue-500"><label className="text-[9px] font-black opacity-30 uppercase block mb-1">數量</label><input type="number" value={formData.quantity} onChange={e=>setFormData({...formData,quantity:e.target.value})} placeholder="數量" className="w-full bg-transparent font-black outline-none" /></div>
                                                    <div className="bg-slate-50 p-4 rounded-3xl border-2 border-transparent focus-within:border-blue-500"><label className="text-[9px] font-black opacity-30 uppercase block mb-1">單價/總額</label><input type="number" value={formData.price} onChange={e=>setFormData({...formData,price:e.target.value})} placeholder="金額" className="w-full bg-transparent font-black outline-none" /></div>
                                                </div>
                                                {currentCategory === '券商' && (
                                                    <>
                                                        <div className="grid grid-cols-2 gap-4">
                                                            <div className="bg-slate-50 p-4 rounded-3xl border-2 border-transparent focus-within:border-blue-500"><label className="text-[9px] font-black opacity-30 uppercase block mb-1 text-center">手續費</label><input type="number" value={formData.fee} onChange={e=>setFormData({...formData,fee:e.target.value})} className="w-full bg-transparent text-center font-black outline-none" /></div>
                                                            <div className="bg-slate-50 p-4 rounded-3xl border-2 border-transparent focus-within:border-blue-500"><label className="text-[9px] font-black opacity-30 uppercase block mb-1 text-center">交易稅</label><input type="number" value={formData.tax} onChange={e=>setFormData({...formData,tax:e.target.value})} className="w-full bg-transparent text-center font-black outline-none" /></div>
                                                        </div>
                                                        <div className="bg-blue-50 p-6 rounded-[32px] text-center border border-blue-100">
                                                            <p className="text-[10px] font-black text-blue-400 uppercase tracking-widest mb-1">預估交割金額</p>
                                                            <p className="text-3xl font-black text-blue-600 tracking-tighter">${Math.round(settlementDisplay).toLocaleString()}</p>
                                                        </div>
                                                    </>
                                                )}
                                            </>
                                        )}
                                        <input type="text" value={formData.memo} onChange={e=>setFormData({...formData,memo:e.target.value})} placeholder="備註 (選填)" className="w-full bg-slate-50 p-5 rounded-3xl font-black outline-none border-2 border-transparent focus:border-blue-500 transition-all" />
                                        <input type="date" value={formData.date} onChange={e=>setFormData({...formData,date:e.target.value})} className="w-full bg-slate-50 p-5 rounded-3xl font-black outline-none" />
                                    </div>
                                    <button onClick={handleSubmit} disabled={loading} className="w-full bg-blue-600 text-white py-6 rounded-[32px] font-black shadow-2xl flex justify-center items-center gap-2 text-lg active:scale-95 transition-all">{loading ? <Icons.RefreshCw className="animate-spin" /> : submitStatus}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isConfirmOpen && (
                        <div className="fixed inset-0 z-[250] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-8">
                            <div className="bg-white w-full max-sm rounded-[32px] p-8 shadow-2xl modal-animate"><h3 className="text-xl font-black text-slate-800 mb-2">{confirmConfig.title}</h3><p className="text-sm text-slate-500 font-bold mb-8 leading-relaxed">{confirmConfig.msg}</p><div className="flex gap-3"><button onClick={()=>setIsConfirmOpen(false)} className="flex-1 py-4 rounded-2xl font-black bg-slate-100 text-slate-500 active:scale-95 transition-all">取消</button><button onClick={confirmConfig.action} className="flex-1 py-4 rounded-2xl font-black bg-red-500 text-white active:scale-95 shadow-lg">確認</button></div></div>
                        </div>
                    )}
                    <div id="toast" className={`fixed top-10 left-1/2 -translate-x-1/2 z-[300] bg-slate-800 text-white px-8 py-4 rounded-full text-sm font-bold shadow-2xl transition-all duration-300 ${toast.show?'opacity-100 scale-100':'opacity-0 scale-90 pointer-events-none'}`}>{toast.msg}</div>
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
